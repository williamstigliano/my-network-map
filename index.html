<!DOCTYPE html>
<html>
<head>
    <title>My Network Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <style>
        html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }

        #searchButton {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            width: 48px; height: 48px; border-radius: 50%;
            border: none; background: white; font-size: 24px; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        #searchPanel {
            position: absolute; top: 70px; left: 12px; z-index: 1000;
            width: 300px; max-height: 50%; overflow-y: auto;
            background: white; padding: 10px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: none;
        }

        #searchInput { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
        #searchCount { margin-top: 6px; font-size: 12px; color: #555; }
        .result-item { padding: 7px; border-bottom: 1px solid #ddd; cursor: pointer; font-size: 13px; }
        .result-item:hover { background: #f0f0f0; }
        .result-name { font-weight: bold; }

        #addButton {
            position: absolute; top: 12px; right: 12px; z-index: 1000;
            background: #007bff; color: white; border: none; border-radius: 50%;
            width: 48px; height: 48px; font-size: 30px; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25); line-height: 42px;
        }

        #legend {
            position: absolute; right: 12px; bottom: 12px; z-index: 1000;
            background: white; padding: 12px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            width: 220px; max-height: 35%; overflow-y: auto; font-size: 14px;
        }

        #legend h3 { margin: 0 0 8px 0; font-size: 16px; }
        .legend-item { display: flex; align-items: center; margin: 6px 0; }
        .legend-checkbox { width: auto; margin: 0 7px 0 0; }
        .legend-color { width: 16px; height: 16px; border-radius: 50%; margin-right: 8px; border: 1px solid #555; }

        #formPanel {
            position: absolute; top: 72px; right: 12px; z-index: 1000;
            width: 320px; max-height: 80%; overflow-y: auto;
            background: white; padding: 14px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: none;
        }

        #exportPanel {
            position: absolute; left: 12px; bottom: 12px; z-index: 1000;
            background: white; padding: 10px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            width: 190px;
        }

        input, select, textarea, button {
            width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 8px; font-size: 14px;
        }

        textarea { height: 70px; }

        .small-button { border: none; border-radius: 6px; cursor: pointer; }
        .save-button { background: #28a745; color: white; }
        .cancel-button { background: #999; color: white; }
        .category-button { background: #444; color: white; }
        .danger-button { background: #dc3545; color: white; }
        .export-button { background: #00695c; color: white; }

        .edit-button, .delete-button {
            color: white; border: none; border-radius: 5px; padding: 6px 10px;
            margin-top: 8px; margin-right: 5px; cursor: pointer; width: auto;
        }

        .edit-button { background: #007bff; }
        .delete-button { background: #dc3545; }

        .popup-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }

        .pin {
            width: 28px; height: 28px; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg); border: 2px solid white;
            box-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        .help-text, #locationStatus {
            font-size: 12px; color: #555; margin-bottom: 8px;
        }

        .hidden-while-form-open { display: none !important; }

        @media (max-width: 700px) {
            #searchPanel {
                top: 70px; left: 12px; right: 12px; width: auto; max-height: 40%;
            }

            #legend {
                right: 10px; bottom: 10px; width: 165px; max-height: 30%;
                font-size: 12px; padding: 9px;
            }

            #exportPanel {
                left: 12px; bottom: 12px; width: 155px; padding: 8px;
            }

            #formPanel {
                left: 10px; right: 10px; bottom: 10px; top: auto;
                width: auto; max-height: 58%; padding: 12px; border-radius: 14px;
            }
        }
    </style>
</head>

<body>

<div id="map"></div>

<button id="searchButton" onclick="toggleSearch()">🔍</button>

<div id="searchPanel">
    <input id="searchInput" placeholder="Search people..." oninput="drawPeople()">
    <div id="searchCount"></div>
    <div id="resultsList"></div>
</div>

<button id="addButton">+</button>

<div id="formPanel">
    <h3 id="formTitle">Add Person</h3>

    <input id="nameInput" placeholder="Name">
    <input id="companyInput" placeholder="Company">

    <input id="locationInput" placeholder="Map location, e.g. Washington DC">
    <div class="help-text">This is sent to the geocoder to place the pin. Use city/state if you want privacy.</div>

    <input id="addressInput" placeholder="Private address/details, saved locally only">
    <div class="help-text">This is only saved in your app and shown in the popup/list.</div>

    <select id="categoryInput"></select>
    <input id="phoneInput" placeholder="Phone">
    <input id="emailInput" placeholder="Email">
    <textarea id="notesInput" placeholder="Notes"></textarea>

    <div id="locationStatus">Map location will be used to place the pin.</div>

    <button class="small-button save-button" onclick="savePerson()">Save Person</button>
    <button class="small-button cancel-button" onclick="closeForm()">Cancel</button>

    <hr>

    <h3>Add Category</h3>
    <input id="newCategoryName" placeholder="Category name, e.g. Professional">
    <input id="newCategoryColor" placeholder="Color, e.g. red, blue, green, purple">
    <button class="small-button category-button" onclick="addCategory()">Add Category</button>

    <hr>

    <button class="small-button danger-button" onclick="clearAllData()">Clear All Saved Data</button>
</div>

<div id="legend">
    <h3>Legend</h3>
    <div id="legendItems"></div>
</div>

<div id="exportPanel">
    <button class="small-button export-button" onclick="exportCSV()">Export to Excel/CSV</button>
    <button class="small-button export-button" onclick="exportJSON()">Export Backup JSON</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
    const defaultCategories = [{ name: "Family", color: "red" }];

    let categories = JSON.parse(localStorage.getItem("categories")) || defaultCategories;
    let people = JSON.parse(localStorage.getItem("people")) || [];
    let visibleCategories = JSON.parse(localStorage.getItem("visibleCategories")) || {};

    let selectedLat = null;
    let selectedLng = null;
    let personMarkers = [];
    let editingIndex = null;

    const map = L.map('map').setView([39.8283, -98.5795], 4);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markerClusterGroup = L.markerClusterGroup({
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
        maxClusterRadius: 35
    });

    map.addLayer(markerClusterGroup);

    const addButton = document.getElementById("addButton");
    const formPanel = document.getElementById("formPanel");
    const searchButton = document.getElementById("searchButton");
    const searchPanel = document.getElementById("searchPanel");
    const exportPanel = document.getElementById("exportPanel");

    addButton.onclick = function() {
        if (formPanel.style.display === "block") closeForm();
        else openAddForm();
    };

    function toggleSearch() {
        searchPanel.style.display = searchPanel.style.display === "block" ? "none" : "block";

        if (searchPanel.style.display === "block") {
            document.getElementById("searchInput").focus();
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem("categories", JSON.stringify(categories));
        localStorage.setItem("people", JSON.stringify(people));
        localStorage.setItem("visibleCategories", JSON.stringify(visibleCategories));
    }

    function ensureVisibleCategories() {
        categories.forEach(category => {
            if (visibleCategories[category.name] === undefined) {
                visibleCategories[category.name] = true;
            }
        });
    }

    function getCategory(categoryName) {
        return categories.find(cat => cat.name === categoryName) || categories[0];
    }

    function createPinIcon(category) {
        return L.divIcon({
            className: "",
            html: `<div class="pin" style="background:${category.color};"></div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 28],
            popupAnchor: [0, -28]
        });
    }

    function drawLegend() {
        ensureVisibleCategories();

        const legendItems = document.getElementById("legendItems");
        legendItems.innerHTML = "";

        categories.forEach(category => {
            const checked = visibleCategories[category.name] ? "checked" : "";

            const row = document.createElement("div");
            row.className = "legend-item";

            row.innerHTML = `
                <input class="legend-checkbox" type="checkbox" ${checked}>
                <div class="legend-color" style="background:${category.color};"></div>
                <span>${category.name}</span>
            `;

            const checkbox = row.querySelector(".legend-checkbox");
            checkbox.onchange = function() {
                toggleCategoryVisibility(category.name, checkbox.checked);
            };

            legendItems.appendChild(row);
        });

        saveToLocalStorage();
    }

    function toggleCategoryVisibility(categoryName, isVisible) {
        visibleCategories[categoryName] = isVisible;
        saveToLocalStorage();
        drawPeople();
    }

    function updateCategoryDropdown() {
        const dropdown = document.getElementById("categoryInput");
        dropdown.innerHTML = "";

        categories.forEach(category => {
            const option = document.createElement("option");
            option.value = category.name;
            option.textContent = category.name;
            dropdown.appendChild(option);
        });
    }

    function matchesSearch(person, searchText) {
        if (!searchText) return true;

        const combinedText = `
            ${person.name}
            ${person.company}
            ${person.location}
            ${person.address}
            ${person.category}
            ${person.phone}
            ${person.email}
            ${person.notes}
        `.toLowerCase();

        return combinedText.includes(searchText.toLowerCase());
    }

    function drawPeople() {
        markerClusterGroup.clearLayers();
        personMarkers = [];

        const searchText = document.getElementById("searchInput").value.trim();

        const filteredPeople = people
            .map((person, index) => ({ person, index }))
            .filter(item => visibleCategories[item.person.category] !== false)
            .filter(item => matchesSearch(item.person, searchText));

        filteredPeople.forEach(item => {
            const person = item.person;
            const originalIndex = item.index;
            const category = getCategory(person.category);

            const marker = L.marker([person.lat, person.lng], {
                icon: createPinIcon(category)
            });

            marker.bindPopup(`
                <div class="popup-title">${person.name}</div>
                <b>Company:</b> ${person.company || ""}<br>
                <b>Map Location:</b> ${person.location || ""}<br>
                <b>Address/Details:</b> ${person.address || ""}<br>
                <b>Category:</b> ${person.category}<br>
                <b>Phone:</b> <a href="tel:${person.phone}">${person.phone || ""}</a><br>
                <b>Email:</b> <a href="mailto:${person.email}">${person.email || ""}</a><br><br>
                <b>Notes:</b><br>
                ${person.notes || ""}<br><br>

                <button class="edit-button" onclick="editPerson(${originalIndex})">Edit</button>
                <button class="delete-button" onclick="deletePerson(${originalIndex})">Delete</button>
            `);

            marker.personIndex = originalIndex;
            personMarkers.push(marker);
            markerClusterGroup.addLayer(marker);
        });

        document.getElementById("searchCount").textContent =
            `${filteredPeople.length} of ${people.length} people shown`;

        drawResultsList(filteredPeople);
    }

    function drawResultsList(filteredPeople) {
        const resultsList = document.getElementById("resultsList");
        resultsList.innerHTML = "";

        filteredPeople.forEach(item => {
            const person = item.person;
            const index = item.index;

            const div = document.createElement("div");
            div.className = "result-item";
            div.innerHTML = `
                <div class="result-name">${person.name}</div>
                <div>${person.company || ""}</div>
                <div>${person.location || ""}</div>
                <div>${person.address || ""}</div>
            `;

            div.onclick = function() {
                const marker = personMarkers.find(m => m.personIndex === index);
                if (marker) {
                    markerClusterGroup.zoomToShowLayer(marker, function() {
                        map.setView(marker.getLatLng(), Math.max(map.getZoom(), 10));
                        marker.openPopup();
                    });
                    searchPanel.style.display = "none";
                }
            };

            resultsList.appendChild(div);
        });
    }

    function hidePanelsForForm() {
        searchButton.classList.add("hidden-while-form-open");
        searchPanel.classList.add("hidden-while-form-open");
        exportPanel.classList.add("hidden-while-form-open");
    }

    function showPanelsAfterForm() {
        searchButton.classList.remove("hidden-while-form-open");
        searchPanel.classList.remove("hidden-while-form-open");
        exportPanel.classList.remove("hidden-while-form-open");
    }

    function openAddForm() {
        editingIndex = null;

        document.getElementById("formTitle").textContent = "Add Person";
        document.querySelector(".save-button").textContent = "Save Person";

        document.getElementById("nameInput").value = "";
        document.getElementById("companyInput").value = "";
        document.getElementById("locationInput").value = "";
        document.getElementById("addressInput").value = "";
        document.getElementById("phoneInput").value = "";
        document.getElementById("emailInput").value = "";
        document.getElementById("notesInput").value = "";

        selectedLat = null;
        selectedLng = null;

        document.getElementById("locationStatus").textContent =
            "Map location will be used to place the pin.";

        formPanel.style.display = "block";
        addButton.innerHTML = "×";
        hidePanelsForForm();
    }

    function editPerson(index) {
        const person = people[index];

        editingIndex = index;

        document.getElementById("formTitle").textContent = "Edit Person";
        document.querySelector(".save-button").textContent = "Save Changes";

        document.getElementById("nameInput").value = person.name || "";
        document.getElementById("companyInput").value = person.company || "";
        document.getElementById("locationInput").value = person.location || person.address || "";
        document.getElementById("addressInput").value = person.address || "";
        document.getElementById("categoryInput").value = person.category || categories[0].name;
        document.getElementById("phoneInput").value = person.phone || "";
        document.getElementById("emailInput").value = person.email || "";
        document.getElementById("notesInput").value = person.notes || "";

        selectedLat = person.lat;
        selectedLng = person.lng;

        document.getElementById("locationStatus").textContent =
            `Current saved coordinates: ${selectedLat.toFixed(4)}, ${selectedLng.toFixed(4)}. Saving will re-check the map location.`;

        formPanel.style.display = "block";
        addButton.innerHTML = "×";
        hidePanelsForForm();

        map.closePopup();
    }

    function closeForm() {
        formPanel.style.display = "none";
        addButton.innerHTML = "+";
        showPanelsAfterForm();

        editingIndex = null;
        selectedLat = null;
        selectedLng = null;

        document.getElementById("locationStatus").textContent =
            "Map location will be used to place the pin.";
    }

    async function geocodeLocation(locationText) {
        const url =
            "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
            encodeURIComponent(locationText);

        const response = await fetch(url, {
            headers: { "Accept": "application/json" }
        });

        const results = await response.json();

        if (!results || results.length === 0) return null;

        return {
            lat: parseFloat(results[0].lat),
            lng: parseFloat(results[0].lon),
            displayName: results[0].display_name
        };
    }

    async function savePerson() {
        const name = document.getElementById("nameInput").value.trim();
        const company = document.getElementById("companyInput").value.trim();
        const location = document.getElementById("locationInput").value.trim();
        const address = document.getElementById("addressInput").value.trim();
        const category = document.getElementById("categoryInput").value;
        const phone = document.getElementById("phoneInput").value.trim();
        const email = document.getElementById("emailInput").value.trim();
        const notes = document.getElementById("notesInput").value.trim();

        if (!name) {
            alert("Please enter a name.");
            return;
        }

        if (!location) {
            alert("Please enter a map location, such as city/state.");
            return;
        }

        document.getElementById("locationStatus").textContent = "Finding map location...";

        const foundLocation = await geocodeLocation(location);

        if (!foundLocation) {
            document.getElementById("locationStatus").textContent =
                "Could not find that location. Try city + state, such as Raleigh, NC.";
            alert("Could not find that location. Try adding more detail.");
            return;
        }

        selectedLat = foundLocation.lat;
        selectedLng = foundLocation.lng;

        const personData = {
            name, company, location, address, category, phone, email, notes,
            lat: selectedLat,
            lng: selectedLng
        };

        if (editingIndex === null) people.push(personData);
        else people[editingIndex] = personData;

        saveToLocalStorage();
        closeForm();
        drawPeople();

        map.setView([selectedLat, selectedLng], 10);
    }

    function deletePerson(index) {
        const person = people[index];
        if (!confirm(`Delete ${person.name}?`)) return;

        people.splice(index, 1);
        saveToLocalStorage();
        drawPeople();
    }

    function addCategory() {
        const name = document.getElementById("newCategoryName").value.trim();
        const color = document.getElementById("newCategoryColor").value.trim();

        if (!name || !color) {
            alert("Please enter category name and color.");
            return;
        }

        if (categories.some(cat => cat.name.toLowerCase() === name.toLowerCase())) {
            alert("That category already exists.");
            return;
        }

        categories.push({ name, color });
        visibleCategories[name] = true;

        saveToLocalStorage();

        document.getElementById("newCategoryName").value = "";
        document.getElementById("newCategoryColor").value = "";

        drawLegend();
        updateCategoryDropdown();
        drawPeople();
    }

    function clearAllData() {
        if (!confirm("Are you sure? This will delete all saved people and categories.")) return;

        localStorage.removeItem("people");
        localStorage.removeItem("categories");
        localStorage.removeItem("visibleCategories");

        people = [];
        categories = defaultCategories;
        visibleCategories = {};

        ensureVisibleCategories();
        saveToLocalStorage();

        drawLegend();
        updateCategoryDropdown();
        drawPeople();
        closeForm();
    }

    function exportCSV() {
        if (!confirm("Export your network data as a local CSV file? You can open it in Excel.")) return;

        const headers = ["Name", "Company", "Map Location", "Address/Details", "Category", "Phone", "Email", "Notes", "Latitude", "Longitude"];

        const rows = people.map(p => [
            p.name || "", p.company || "", p.location || "", p.address || "",
            p.category || "", p.phone || "", p.email || "", p.notes || "",
            p.lat || "", p.lng || ""
        ]);

        const csvContent = [headers, ...rows]
            .map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(","))
            .join("\n");

        downloadFile(csvContent, "my_network_map_export.csv", "text/csv");
    }

    function exportJSON() {
        if (!confirm("Export a full local backup JSON file? This is best for restoring the app later.")) return;

        const backup = {
            exportedAt: new Date().toISOString(),
            categories: categories,
            visibleCategories: visibleCategories,
            people: people
        };

        downloadFile(JSON.stringify(backup, null, 2), "my_network_map_backup.json", "application/json");
    }

    function downloadFile(content, filename, type) {
        const blob = new Blob([content], { type: type });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();

        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    ensureVisibleCategories();
    drawLegend();
    updateCategoryDropdown();
    drawPeople();
</script>

</body>
</html>
